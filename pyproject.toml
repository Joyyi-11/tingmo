[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tingmo"
version = "0.1.0"
description = "听墨：面向小宇宙播客的结构化 Markdown 文稿生成工具"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "faster-whisper>=1.0",
    "ctranslate2==4.6.0",
    "diarize>=0.1.2",
]

[project.scripts]
tingmo = "src.main:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N"]
"src/processor/prompt.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
